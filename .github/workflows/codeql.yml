name: CodeQL

on:
  pull_request:
    paths:
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-14
    timeout-minutes: 55
    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        language: [swift, c-cpp]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SWAN_SWIFTPM_DISABLE_KEYCHAIN: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build the analyzed boundary
        run: |
          set -eu
          ./Scripts/swift-package.sh build \
            --package-path . \
            --disable-index-store \
            --jobs 3 \
            --product SwanSongChecks

      - name: Analyze
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:${{ matrix.language }}"
